server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: actor-service
          uri: http://localhost:5237
          predicates:
            - Path=/api/Actor,/api/Actor/**,/api/FilmActor,/api/FilmActor/**

        - id: film-service
          uri: http://localhost:5174
          predicates:
            - Path=/api/Film,/api/Film/**,/api/Regizor,/api/Regizor/**,/api/Scenarist,/api/Scenarist/**,/api/Producator,/api/Producator/**,/api/FilmImagine,/api/FilmImagine/**

        - id: user-service
          uri: http://localhost:5230
          predicates:
            - Path=/api/User,/api/User/**

        - id: statistics-service
          uri: http://localhost:5238
          predicates:
            - Path=/api/Statistic,/api/Statistic/**
